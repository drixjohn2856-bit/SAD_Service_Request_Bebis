<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | ICT Service Request System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <div class="brand-mark"><span class="brand-icon">+</span><span>ICT SERVICE REQUEST SYSTEM</span></div>
    <section class="auth-card">
      <p class="eyebrow">Service desk access</p>
      <h1>Welcome back.</h1>
      <p>Sign in to manage university technology requests.</p>
      <form id="login-form" class="form-stack">
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <div id="login-error" class="error-message hidden" role="alert"></div>
        <button class="button button-primary" type="submit">LOGIN</button>
      </form>
      <p class="auth-switch">Don&apos;t have an account? <button id="register-button" class="button button-text" type="button">Register</button></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
