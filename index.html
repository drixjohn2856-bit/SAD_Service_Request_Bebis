<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | ICT Service Request System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark"><span class="brand-icon">+</span><span>ICT SERVICE REQUEST SYSTEM</span></div>
      <div class="user-actions"><span class="user-badge">Welcome, <strong id="user-name">User</strong></span><button id="logout-button" class="button button-quiet" type="button">Logout</button></div>
    </header>
    <section class="page-heading"><div><p class="eyebrow">Operations dashboard</p><h1>Service requests</h1></div><button id="new-request-button" class="button button-primary" type="button">+ New Request</button></section>
    <section class="stats" aria-label="Request summary">
      <article class="stat"><div class="stat-label">TOTAL REQUESTS</div><div id="total-count" class="stat-value">0</div></article>
      <article class="stat"><div class="stat-label">PENDING</div><div id="pending-count" class="stat-value">0</div></article>
      <article class="stat"><div class="stat-label">IN PROGRESS</div><div id="progress-count" class="stat-value">0</div></article>
      <article class="stat"><div class="stat-label">COMPLETED</div><div id="completed-count" class="stat-value">0</div></article>
    </section>
    <section class="workspace">
      <aside id="request-panel" class="panel">
        <div class="panel-header"><h2 id="form-title">New request</h2><button id="cancel-button" class="button button-text hidden" type="button">Cancel</button></div>
        <form id="request-form" class="form-stack">
          <input id="request-id" type="hidden">
          <div class="field"><label for="requester">Requester Name</label><input id="requester" required placeholder="Juan Dela Cruz"></div>
          <div class="field"><label for="department">Department</label><input id="department" required placeholder=" Enter Department"></div>
          <div class="field"><label for="category">Category</label><select id="category" required><option value="">Select category</option><option>Computer Repair</option><option>Software Installation</option><option>Network Problem</option><option>Printer Problem</option><option>Account/Access Concern</option><option>Other</option></select></div>
          <div class="field"><label for="description">Description</label><textarea id="description" required placeholder="Computer cannot connect to university Wi-Fi."></textarea></div>
          <div class="field"><label for="priority">Priority</label><select id="priority" required><option value="">Select priority</option><option>Low</option><option>Medium</option><option>High</option></select></div>
          <div id="status-field" class="field hidden"><label for="status">Status</label><select id="status"><option>Pending</option><option>In Progress</option><option>Completed</option></select></div>
          <div id="form-error" class="error-message hidden" role="alert"></div>
          <div class="form-actions"><button class="button button-primary" type="submit">Submit Request</button></div>
        </form>
      </aside>
      <section class="panel"><div class="panel-header"><h2>Service requests</h2></div>
        <div class="toolbar"><input id="search-input" type="search" placeholder="Search requester or description" aria-label="Search requester or description"><select id="status-filter" aria-label="Filter by status"><option value="All">Status: All</option><option>Pending</option><option>In Progress</option><option>Completed</option></select><select id="priority-filter" aria-label="Filter by priority"><option value="All">Priority: All</option><option>Low</option><option>Medium</option><option>High</option></select></div>
        <div class="table-wrap"><table><thead><tr><th>ID</th><th>Requester</th><th>Department</th><th>Category</th><th>Priority</th><th>Status</th><th>Date Requested</th><th>Actions</th></tr></thead><tbody id="request-rows"></tbody></table><div id="empty-state" class="empty-state hidden">No service requests match the current filters.</div></div>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
